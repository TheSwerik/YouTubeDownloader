kind: pipeline
type: docker
name: test
platform:
  os: linux
  arch: arm64
trigger:
  branch:
    - main
steps:
  - name: run tests
    image: mcr.microsoft.com/dotnet/sdk:10.0
    commands:
      - dotnet test
---
kind: pipeline
type: ssh
name: build Deploy Images
depends_on:
  - test
platform:
  os: linux
  arch: arm64
trigger:
  branch:
    - main
server:
  host: erikpi
  user:
    from_secret: SSH_USERNAME
  password:
    from_secret: SSH_PASSWORD
steps:
  - name: build Backend
    commands:
      - docker --config /home/drone/.docker login localhost:5000 -u $USERNAME -p $PASSWORD
      - docker build -t localhost:5000/youtubedownloader/backend -f Backend/Dockerfile --progress plain .
      - docker push localhost:5000/youtubedownloader/backend:latest
    environment:
      USERNAME:
        from_secret: REGISTRY_USERNAME
      PASSWORD:
        from_secret: REGISTRY_PASSWORD

  - name: build Frontend
    commands:
      - docker --config /home/drone/.docker login localhost:5000 -u $USERNAME -p $PASSWORD
      - docker build -t localhost:5000/youtubedownloader/frontend -f Frontend/Dockerfile --progress plain .
      - docker push localhost:5000/youtubedownloader/frontend:latest
    environment:
      USERNAME:
        from_secret: REGISTRY_USERNAME
      PASSWORD:
        from_secret: REGISTRY_PASSWORD

  - name: parallelism
    commands:
      - echo "parallelism successful"
    depends_on:
      - build Backend
      - build Frontend
---
kind: pipeline
type: ssh
name: Deploy
depends_on:
  - build Deploy Images
platform:
  os: linux
  arch: arm64
trigger:
  branch:
    - main
server:
  host: erikpi
  user:
    from_secret: SSH_USERNAME
  password:
    from_secret: SSH_PASSWORD
steps:
  - name: docker login & Deploy
    commands:
      - docker --config /home/drone/.docker login localhost:5000 -u $USERNAME -p $PASSWORD
      - docker --config /home/drone/.docker compose up -d --pull always
    environment:
      USERNAME:
        from_secret: REGISTRY_USERNAME
      PASSWORD:
        from_secret: REGISTRY_PASSWORD